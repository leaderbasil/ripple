<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 960" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ah2" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1e2a52"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="960" fill="#f3f6f2"/>

  <text x="320" y="88" text-anchor="middle" font-size="40" font-weight="700" fill="#1e2a52">THE RIPPLE ENGINE</text>
  <text x="320" y="130" text-anchor="middle" font-size="24" fill="#5a6280">same idea - engineered, dynamic, deterministic</text>

  <!-- left: automatic discovery + ripple wave -->
  <rect x="40" y="176" width="176" height="36" rx="18" fill="#e3efe1"/>
  <text x="128" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#1e5a35">auto-discovered</text>

  <circle cx="120" cy="320" r="78" fill="none" stroke="#e2703a" stroke-width="2.5" stroke-dasharray="7 7" opacity="0.75"/>
  <circle cx="120" cy="320" r="96" fill="none" stroke="#e2703a" stroke-width="2" stroke-dasharray="5 8" opacity="0.45"/>

  <circle cx="120" cy="320" r="62" fill="#2f9e63"/>
  <text x="120" y="315" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">user_model</text>
  <text x="120" y="335" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">.h  (edited)</text>

  <circle cx="75" cy="470" r="40" fill="#17307b"/>
  <text x="75" y="466" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">home</text>
  <text x="75" y="484" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">cpp</text>

  <circle cx="168" cy="470" r="40" fill="#17307b"/>
  <text x="168" y="466" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">user_model</text>
  <text x="168" y="484" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">cpp</text>

  <line x1="98" y1="376" x2="81" y2="426" stroke="#1e2a52" stroke-width="3" marker-end="url(#ah2)"/>
  <line x1="142" y1="374" x2="158" y2="426" stroke="#1e2a52" stroke-width="3" marker-end="url(#ah2)"/>

  <text x="120" y="560" text-anchor="middle" font-size="14" fill="#5a6280">dotted rings = the wave: BFS</text>
  <text x="120" y="582" text-anchor="middle" font-size="14" fill="#5a6280">settings.cpp untouched here</text>

  <!-- right: the five stages -->
  <line x1="450" y1="288" x2="450" y2="316" stroke="#1e2a52" stroke-width="3" marker-end="url(#ah2)"/>
  <line x1="450" y1="430" x2="450" y2="458" stroke="#1e2a52" stroke-width="3" marker-end="url(#ah2)"/>
  <line x1="450" y1="572" x2="450" y2="600" stroke="#1e2a52" stroke-width="3" marker-end="url(#ah2)"/>
  <line x1="450" y1="714" x2="450" y2="742" stroke="#1e2a52" stroke-width="3" marker-end="url(#ah2)"/>

  <rect x="300" y="180" width="300" height="94" rx="22" fill="#7db8f2"/>
  <circle cx="340" cy="227" r="20" fill="#17307b"/>
  <text x="340" y="233" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">1</text>
  <text x="375" y="223" font-size="23" font-weight="700" fill="#1e2a52">SCAN</text>
  <text x="375" y="246" font-size="15" fill="#25314e">walk folder, turn every</text>
  <text x="375" y="265" font-size="15" fill="#25314e">#include "..." into an edge</text>

  <rect x="300" y="322" width="300" height="94" rx="22" fill="#f5c044"/>
  <circle cx="340" cy="369" r="20" fill="#17307b"/>
  <text x="340" y="375" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">2</text>
  <text x="375" y="365" font-size="23" font-weight="700" fill="#1e2a52">FINGERPRINT</text>
  <text x="375" y="388" font-size="15" fill="#25314e">FNV-1a 64-bit hash;</text>
  <text x="375" y="407" font-size="15" fill="#25314e">mtime+size skips re-reading</text>

  <rect x="300" y="464" width="300" height="94" rx="22" fill="#2f9e63"/>
  <circle cx="340" cy="511" r="20" fill="#ffffff"/>
  <text x="340" y="517" text-anchor="middle" font-size="20" font-weight="700" fill="#17307b">3</text>
  <text x="375" y="507" font-size="23" font-weight="700" fill="#0f3d24">RIPPLE</text>
  <text x="375" y="530" font-size="15" fill="#eafff2">BFS along "who includes me"</text>
  <text x="375" y="549" font-size="15" fill="#eafff2">= minimal rebuild set</text>

  <rect x="300" y="606" width="300" height="94" rx="22" fill="#b39ddb"/>
  <circle cx="340" cy="653" r="20" fill="#17307b"/>
  <text x="340" y="659" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">4</text>
  <text x="375" y="649" font-size="23" font-weight="700" fill="#1e2a52">ORDER</text>
  <text x="375" y="672" font-size="15" fill="#2a2340">Kahn topological sort;</text>
  <text x="375" y="691" font-size="15" fill="#2a2340">deterministic, cycle-safe</text>

  <rect x="300" y="748" width="300" height="94" rx="22" fill="#f6c6d4"/>
  <circle cx="340" cy="795" r="20" fill="#17307b"/>
  <text x="340" y="801" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">5</text>
  <text x="375" y="791" font-size="23" font-weight="700" fill="#1e2a52">SAVE</text>
  <text x="375" y="814" font-size="15" fill="#3d2730">atomic baseline.bin</text>
  <text x="375" y="833" font-size="15" fill="#3d2730">written tmp + rename</text>

  <rect x="30" y="880" width="580" height="56" rx="18" fill="#ffe08a"/>
  <text x="320" y="914" text-anchor="middle" font-size="19" font-weight="700" fill="#1e2a52">edit 1 of 9 files - rebuild only 2 - ~78% of the work saved</text>
</svg>
